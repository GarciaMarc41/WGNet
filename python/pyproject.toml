[project]
name = "gaussian-lab"
version = "0.1.0"
description = "Staged Wave-to-Gaussian Seismic Inversion in PyTorch + Rust (wgpu + Rayon)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "maturin>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaussian_lab"]
